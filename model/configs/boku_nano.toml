# Boku-nano (homework.md モデル仕様表の必修モデル, 約1,600万パラメータ)

[model]
vocab_size = 2048
d_model = 384
n_layers = 8
n_heads = 6
n_kv_heads = 6      # 6 = MHA。GQAにしたい場合は約数(例: 2)にする
d_ff = 1024
max_seq_len = 512
rope_theta = 10000.0
norm_eps = 1e-5
tie_embeddings = true

[train]
seed = 0
max_lr = 3e-4
min_lr_ratio = 0.1
warmup_ratio = 0.03
weight_decay = 0.1
grad_clip = 1.0
betas = [0.9, 0.95]
seq_len = 256              # 学習時の最大系列長(これを超える例は捨てる)
micro_batch_size = 64
grad_accum_steps = 2       # global batch ≈ 64*2*平均長。tokens/stepはログに出る
total_tokens = 300_000_000 # 学習中に見る延べトークン数(パディングを除く)
eval_interval = 200
eval_batches = 50
checkpoint_interval = 500
dtype = "bfloat16"
compile = false

[data]
train = "data/train.jsonl"
val = "data/val.jsonl"
tokenizer = "tokenizer/out/tokenizer.json"
cache_dir = "model/out/cache"

[mlflow]
tracking_uri = "sqlite:///model/out/mlflow.db"
experiment = "boku-nano"
